<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyBlock Networth</title>
<style>
  :root {
    --bg: #0a0c11;
    --panel: #12161f;
    --panel-2: #161b26;
    --line: #232a38;
    --line-soft: #1b2230;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --dim: #5d6579;
    --gold: #f2c14e;
    --teal: #4dd4b0;
    --blue: #6aa8ff;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }

  header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 600; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: block; }
  form.search { margin-left: auto; display: flex; gap: 8px; }
  input[type="text"] {
    width: 280px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: #3a465e; }
  input::placeholder { color: var(--dim); }
  button {
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: #3a465e; }
  button.primary { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 600; }
  button.primary:hover { background: #f7cd6a; }
  button.ghost { padding: 6px 12px; font-size: 12px; color: var(--muted); }

  .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 16px; padding: 22px; }

  .error {
    border: 1px solid #4a2026; background: #1d1114; color: #ffb4b4;
    padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 13px;
  }

  .hero { position: relative; overflow: hidden; }
  .hero-top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .who h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .3px; }
  .who .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); font-size: 11px; color: var(--muted); margin-left: 6px; }

  .profiles { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: #3a465e; color: var(--text); }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(242,193,78,.07); }

  .networth-row { display: flex; align-items: baseline; gap: 12px; margin-top: 26px; }
  .networth { font-size: 54px; font-weight: 600; letter-spacing: -1px; color: var(--gold); line-height: 1.1; }
  .networth small { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 2px; }
  .coins-exact { color: var(--dim); font-size: 12px; }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
  .metric { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric .v { font-size: 18px; font-weight: 500; margin-top: 2px; }

  .coins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }

  .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 880px) {
    .grid, .metrics, .coins { grid-template-columns: 1fr; }
    .networth { font-size: 42px; }
    form.search { width: 100%; margin-left: 0; }
    input[type="text"] { flex: 1; width: auto; }
  }

  h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .6px; margin: 0 0 16px; text-transform: uppercase; }

  .bar-row { display: grid; grid-template-columns: 82px 1fr 108px; gap: 12px; align-items: center; margin-bottom: 10px; }
  .bar-row .name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .val { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 8px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--teal); width: 0; transition: width .5s ease; }

  .items { display: flex; flex-direction: column; gap: 2px; }
  .item { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .item:last-child { border-bottom: 0; }
  .item .idx { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .item .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .pr { font-size: 13px; color: var(--gold); font-variant-numeric: tabular-nums; }

  .items-card { margin-top: 16px; }
  .items-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .items-head h2 { margin: 0; }
  .items-head .count { color: var(--dim); font-size: 12px; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .filters { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters input, .filters select {
    padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 12px; outline: none;
  }
  .filters input { width: 200px; }
  .filters select { cursor: pointer; }

  .item-rows { display: flex; flex-direction: column; }
  .item-block { border-bottom: 1px solid var(--line-soft); }
  .item-block:last-child { border-bottom: 0; }
  .irow {
    display: grid; grid-template-columns: 30px minmax(0,1fr) 88px 54px 96px 14px;
    gap: 10px; align-items: center; width: 100%; padding: 8px 4px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .irow:hover { background: rgba(255,255,255,.025); }
  .ico { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated; }
  .iname { min-width: 0; }
  .iname .nm { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iname .sub { display: block; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icont { font-size: 11px; color: var(--muted); }
  .icount { font-size: 11px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .iprice { font-size: 13px; color: var(--gold); text-align: right; font-variant-numeric: tabular-nums; }
  .chev { color: var(--dim); font-size: 10px; transition: transform .15s; }
  .item-block.open .chev { transform: rotate(90deg); }

  .idetail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 2px 4px 16px 40px; }
  .lore {
    background: #0b0d13; border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; line-height: 1.8; max-height: 280px; overflow: auto;
  }
  .lore div { min-height: 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .fact { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .calc { font-size: 12px; }
  .calc-title { color: var(--muted); font-size: 11px; margin: 4px 0 8px; }
  .calc-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line-soft); }
  .calc-row > span:first-child { color: var(--muted); }
  .calc-row > span:last-child { font-variant-numeric: tabular-nums; }
  .wikilink { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--blue); text-decoration: none; }
  .wikilink:hover { text-decoration: underline; }
  .items-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--dim); font-size: 12px; }
  @media (max-width: 880px) {
    .idetail { grid-template-columns: 1fr; padding-left: 4px; }
    .irow { grid-template-columns: 26px minmax(0,1fr) 72px 16px; }
    .icount, .icont { display: none; }
    .filters { margin-left: 0; width: 100%; }
    .filters input { flex: 1; width: auto; }
  }

  .empty { text-align: center; padding: 64px 20px; color: var(--dim); }
  .empty strong { display: block; color: var(--muted); font-weight: 500; margin-bottom: 6px; }

  .foot { margin-top: 26px; display: flex; justify-content: space-between; gap: 12px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .foot a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--line); }

  .loading { position: absolute; inset: 0; background: rgba(10,12,17,.66); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); backdrop-filter: blur(2px); }
  .hidden { display: none !important; }
  .skeleton { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i> SKYBLOCK NETWORTH</div>
    <form class="search" id="search">
      <input id="player" type="text" placeholder="游戏 ID 或 UUID，例如 _Ninym_" autocomplete="off" spellcheck="false" />
      <button class="primary" type="submit">查询</button>
    </form>
  </header>

  <div id="error" class="error hidden"></div>

  <section class="card hero" id="hero">
    <div id="empty" class="empty">
      <strong>输入一个游戏 ID 开始</strong>
      数据来自 Hypixel 官方 API，净值在本机计算
    </div>

    <div id="result" class="hidden">
      <div class="hero-top">
        <div class="who">
          <h1 id="pname">—</h1>
          <div class="meta" id="pmeta">—</div>
        </div>
        <div class="hero-actions">
          <div class="profiles" id="profiles"></div>
          <button class="ghost" id="refresh" type="button">刷新数据</button>
        </div>
      </div>

      <div class="networth-row">
        <div class="networth" id="networth">—</div>
        <div class="coins-exact" id="exact"></div>
      </div>

      <div class="metrics">
        <div class="metric"><div class="k">不含灵魂绑定</div><div class="v" id="m-unsoul">—</div></div>
        <div class="metric"><div class="k">不含化妆品</div><div class="v" id="m-cosmetic">—</div></div>
        <div class="metric"><div class="k">现金合计</div><div class="v" id="m-cash">—</div></div>
      </div>

      <div class="coins">
        <div class="metric"><div class="k">钱包</div><div class="v" id="m-purse">—</div></div>
        <div class="metric"><div class="k">银行（合作岛共享）</div><div class="v" id="m-bank">—</div></div>
        <div class="metric"><div class="k">个人银行</div><div class="v" id="m-pbank">—</div></div>
      </div>
    </div>

    <div id="loading" class="loading hidden">查询中…</div>
  </section>

  <div class="grid">
    <section class="card">
      <h2>分类明细</h2>
      <div id="breakdown" class="skeleton">尚无数据</div>
    </section>
    <section class="card">
      <h2>最贵物品</h2>
      <div id="items" class="skeleton">尚无数据</div>
    </section>
  </div>

  <section class="card items-card">
    <div class="items-head">
      <h2>全部物品<span class="count" id="item-total"></span></h2>
      <div class="filters">
        <input id="item-search" type="text" placeholder="搜索物品 / 附魔 / 重铸" autocomplete="off" spellcheck="false" />
        <select id="container-filter"><option value="">全部容器</option></select>
        <select id="sort-by">
          <option value="price-desc">价格从高到低</option>
          <option value="price-asc">价格从低到高</option>
          <option value="name">按名称</option>
        </select>
      </div>
    </div>
    <div id="item-rows" class="item-rows"><div class="skeleton" style="padding:16px 0">查询后显示全部物品</div></div>
    <div class="items-foot">
      <button id="load-more" class="ghost hidden" type="button">显示更多</button>
      <span id="shown-count"></span>
    </div>
  </section>

  <div class="foot">
    <span>数据来源：Hypixel Public API · 价格：SkyHelper，5 分钟缓存<span id="updated"></span></span>
    <a href="https://github.com/PiggyHanHan/skyblock-networth" target="_blank" rel="noreferrer">GitHub</a>
  </div>
</div>

<script>
const LABELS = {
  armor: '护甲', equipment: '装备', wardrobe: '衣柜', inventory: '背包', enderchest: '末影箱',
  accessories: '饰品', personal_vault: '个人金库', fishing_bag: '鱼袋', potion_bag: '药水袋',
  sacks_bag: '麻袋背包', sacks: '麻袋', candy_inventory: '糖果袋', carnival_mask_inventory: '嘉年华面具',
  storage: '箱子仓库', museum: '博物馆', essence: '精华', pets: '宠物', quiver: '箭袋',
  farming_toolkit: '农耕工具箱', hunting_toolkit: '狩猎工具箱',
};
const MODES = { normal: '普通', ironman: '铁人', bingo: 'Bingo', stranded: '荒岛', isle: '普通' };

const $ = (id) => document.getElementById(id);
let state = { player: '', profiles: [], profile: '' };

function fmt(n) {
  if (!Number.isFinite(n) || n === 0) return '0';
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(1) + 'K';
  return s + Math.round(a).toLocaleString('en-US');
}
const comma = (n) => Math.round(n).toLocaleString('en-US');
const show = (el, on) => el.classList.toggle('hidden', !on);

async function api(path) {
  const res = await fetch(path);
  let data = {};
  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) throw new Error(data.error || '请求失败（' + res.status + '）');
  return data;
}

function setError(msg) {
  const el = $('error');
  el.textContent = msg;
  show(el, !!msg);
}
function setLoading(on) {
  show($('loading'), on);
  $('search').querySelector('button').disabled = on;
}

function renderProfiles() {
  const box = $('profiles');
  box.innerHTML = '';
  if (state.profiles.length < 2) return;
  for (const p of state.profiles) {
    const b = document.createElement('button');
    b.className = 'chip' + (p.cute_name === state.profile ? ' on' : '');
    b.type = 'button';
    b.textContent = p.cute_name;
    b.onclick = () => {
      if (p.cute_name === state.profile) return;
      state.profile = p.cute_name;
      renderProfiles();
      loadNetworth();
    };
    box.appendChild(b);
  }
}

function render(d) {
  state.player = d.player.name || state.player;
  $('pname').textContent = d.player.name || '未知玩家';
  const mode = MODES[d.profile.game_mode] || '普通';
  $('pmeta').innerHTML =
    '<span>' + d.player.uuid + '</span>' +
    '<span class="tag">' + d.profile.cute_name + '</span>' +
    '<span class="tag">' + mode + '模式</span>';

  $('networth').innerHTML = fmt(d.networth) + '<small>coins</small>';
  $('exact').textContent = comma(d.networth) + ' 枚';
  $('updated').textContent = ' · 更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });

  $('m-unsoul').textContent = fmt(d.unsoulboundNetworth);
  $('m-cosmetic').textContent = fmt(d.nonCosmeticNetworth);
  $('m-cash').textContent = fmt(d.purse + d.bank + d.personalBank);
  $('m-purse').textContent = fmt(d.purse);
  $('m-bank').textContent = fmt(d.bank);
  $('m-pbank').textContent = fmt(d.personalBank);

  const types = Object.entries(d.types || {}).filter(([, v]) => v.total > 0).sort((a, b) => b[1].total - a[1].total);
  const max = types.length ? types[0][1].total : 1;
  const total = d.networth || 1;
  $('breakdown').className = '';
  $('breakdown').innerHTML = types.length
    ? types.map(([k, v]) =>
        '<div class="bar-row" title="' + comma(v.total) + ' 枚">' +
          '<div class="name">' + (LABELS[k] || k) + '</div>' +
          '<div class="track"><div class="fill" data-w="' + Math.max(3, (v.total / max) * 100).toFixed(1) + '"></div></div>' +
          '<div class="val">' + fmt(v.total) + ' <span style="color:var(--dim)">' + Math.round((v.total / total) * 100) + '%</span></div>' +
        '</div>').join('')
    : '<div class="skeleton">没有可计入的容器</div>';

  const items = d.topItems || [];
  $('items').className = 'items';
  $('items').innerHTML = items.length
    ? items.map((it, i) =>
        '<div class="item">' +
          '<div class="idx">' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="nm" title="' + it.name.replace(/"/g, '&quot;') + '">' + it.name + (it.count > 1 ? ' <span style="color:var(--dim)">x' + it.count + '</span>' : '') + '</div>' +
          '<div class="pr">' + fmt(it.price) + '</div>' +
        '</div>').join('')
    : '<div class="skeleton">背包未开启或没有物品</div>';

  requestAnimationFrame(() => {
    document.querySelectorAll('.fill').forEach((el) => { el.style.width = el.dataset.w + '%'; });
  });

  show($('empty'), false);
  show($('result'), true);
}

async function loadNetworth(refresh) {
  setLoading(true);
  setError('');
  try {
    const q = '/api/networth?player=' + encodeURIComponent(state.player) +
      '&profile=' + encodeURIComponent(state.profile) + (refresh ? '&refresh=1' : '');
    const d = await api(q);
    render(d);
    loadItems(refresh);
  } catch (e) {
    setError(e.message);
  } finally {
    setLoading(false);
  }
}

async function lookup(name) {
  if (!name) return;
  setLoading(true);
  setError('');
  try {
    const d = await api('/api/profiles?player=' + encodeURIComponent(name));
    state.player = d.player.name || name;
    state.profiles = d.profiles || [];
    const chosen = state.profiles.find((p) => p.selected) || state.profiles[0];
    if (!chosen) throw new Error('该玩家没有 SkyBlock 档案');
    state.profile = chosen.cute_name;
    renderProfiles();
    $('player').value = state.player;
    history.replaceState(null, '', '?player=' + encodeURIComponent(state.player));
    await loadNetworth();
  } catch (e) {
    setError(e.message);
  } finally {
    setLoading(false);
  }
}

$('search').addEventListener('submit', (e) => {
  e.preventDefault();
  lookup($('player').value.trim());
});
$('refresh').addEventListener('click', () => loadNetworth(true));

window.addEventListener('error', (e) => setError(String(e.message || e)));

const ITEMS = { all: [], view: [], shown: 0, page: 60 };
const MC_COLORS = {
  0: '#4a4a4a', 1: '#4a4aff', 2: '#4aff4a', 3: '#4affff', 4: '#ff5555', 5: '#ff55ff',
  6: '#ffaa00', 7: '#aaaaaa', 8: '#6a6a6a', 9: '#7a7aff', a: '#68e068', b: '#5be0e0',
  c: '#ff6b6b', d: '#ff77ff', e: '#ffff6b', f: '#f2f2f2',
};
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const stripMc = (s) => String(s || '').replace(/§./g, '');

function mcToHtml(raw) {
  const text = String(raw || '');
  let out = '';
  let st = { color: '', bold: false, italic: false, under: false, strike: false };
  const flush = (chunk) => {
    if (!chunk) return;
    const css = [];
    if (st.color) css.push('color:' + st.color);
    if (st.bold) css.push('font-weight:600');
    if (st.italic) css.push('font-style:italic');
    const deco = [];
    if (st.under) deco.push('underline');
    if (st.strike) deco.push('line-through');
    if (deco.length) css.push('text-decoration:' + deco.join(' '));
    out += css.length ? '<span style="' + css.join(';') + '">' + esc(chunk) + '</span>' : esc(chunk);
  };
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '§' && i + 1 < text.length) {
      const code = text[++i].toLowerCase();
      if (code === 'r') st = { color: '', bold: false, italic: false, under: false, strike: false };
      else if (code === 'l') st.bold = true;
      else if (code === 'o') st.italic = true;
      else if (code === 'n') st.under = true;
      else if (code === 'm') st.strike = true;
      else if (code === 'k') { /* 乱码效果不做处理 */ }
      else if (code === 'x') {
        let hex = '';
        for (let k = 0; k < 6 && i + 2 < text.length; k++) { i += 2; hex += text[i]; }
        if (/^[0-9a-f]{6}$/i.test(hex)) st.color = '#' + hex;
      } else if (MC_COLORS[code]) {
        st.color = MC_COLORS[code];
        st.bold = false; st.italic = false; st.under = false; st.strike = false;
      }
      continue;
    }
    let j = i;
    while (j < text.length && text[j] !== '§') j++;
    flush(text.slice(i, j));
    i = j - 1;
  }
  return out;
}

function itemSubtitle(it) {
  const bits = [];
  if (it.reforge) bits.push(it.reforge);
  if (it.stars) bits.push('★ ' + it.stars);
  if (it.pet) bits.push(it.pet.tier + ' 宠物');
  if (it.enchants && it.enchants.length) bits.push(it.enchants.length + ' 条附魔');
  if (it.recombobulated) bits.push('已重铸');
  if (it.soulbound) bits.push('灵魂绑定');
  return bits.join(' · ');
}

function buildContainerOptions() {
  const present = [...new Set(ITEMS.all.map((i) => i.container))].sort();
  const sel = $('container-filter');
  const keep = sel.value;
  sel.innerHTML = '<option value="">全部容器</option>' +
    present.map((k) => '<option value="' + k + '">' + (LABELS[k] || k) + '</option>').join('');
  if (present.includes(keep)) sel.value = keep;
}

function applyItemFilters() {
  const q = $('item-search').value.trim().toLowerCase();
  const container = $('container-filter').value;
  const sort = $('sort-by').value;

  ITEMS.view = ITEMS.all.filter((it) => {
    if (container && it.container !== container) return false;
    if (!q) return true;
    const hay = [stripMc(it.displayName), it.reforge || '', it.pet ? it.pet.type : '']
      .concat((it.enchants || []).map((e) => e.name))
      .join(' ')
      .toLowerCase();
    return hay.includes(q);
  });

  if (sort === 'price-asc') ITEMS.view.sort((a, b) => a.price - b.price);
  else if (sort === 'name') ITEMS.view.sort((a, b) => stripMc(a.displayName).localeCompare(stripMc(b.displayName), 'zh'));
  else ITEMS.view.sort((a, b) => b.price - a.price);

  ITEMS.shown = Math.min(ITEMS.page, ITEMS.view.length);
  renderItemRows();
}

function itemBlock(it, idx) {
  const unit = it.count > 1 ? '<span class="sub">单价 ' + fmt(it.unitPrice) + '</span>' : '';
  return (
    '<div class="item-block" data-idx="' + idx + '">' +
      '<button class="irow" type="button" title="' + esc(stripMc(it.displayName)) + '">' +
        '<img class="ico" alt="" loading="lazy" src="https://sky.coflnet.com/static/icon/' + encodeURIComponent(it.id) + '" onerror="this.style.visibility=\'hidden\'" />' +
        '<div class="iname"><span class="nm">' + mcToHtml(it.displayName) + '</span><span class="sub">' + esc(itemSubtitle(it)) + unit + '</span></div>' +
        '<div class="icont">' + esc(LABELS[it.container] || it.container) + '</div>' +
        '<div class="icount">' + (it.count > 1 ? 'x' + comma(it.count) : '') + '</div>' +
        '<div class="iprice">' + fmt(it.price) + '</div>' +
        '<span class="chev">▶</span>' +
      '</button>' +
      '<div class="idetail hidden"></div>' +
    '</div>'
  );
}

function detailHtml(it) {
  const facts = [];
  if (it.rarity) facts.push(it.rarity);
  if (it.reforge) facts.push('重铸 ' + it.reforge);
  if (it.stars) facts.push('★ ' + it.stars);
  if (it.hotPotatoBooks) facts.push('热土豆书 ' + it.hotPotatoBooks);
  if (it.artOfWar) facts.push('战争艺术');
  if (it.recombobulated) facts.push('重铸成更高稀有度');
  if (it.soulbound) facts.push('灵魂绑定');
  if (it.pet) {
    facts.push(it.pet.tier + ' ' + it.pet.type);
    facts.push('经验 ' + comma(it.pet.exp));
    if (it.pet.heldItem) facts.push('持有 ' + it.pet.heldItem);
    if (it.pet.candyUsed) facts.push('糖果 ' + it.pet.candyUsed);
  }

  const enchantChips = (it.enchants || []).map((e) => '<span class="fact">' + esc(e.label) + '</span>').join('');
  const attrChips = (it.attributes || []).map((a) => '<span class="fact">' + esc(a.name) + ' ' + a.level + '</span>').join('');

  const rows = [{ label: '物品本体', price: it.basePrice, count: 1 }].concat(it.calculation || []);
  const calcRows = rows.map((c) =>
    '<div class="calc-row"><span>' + esc(c.label) + (c.count > 1 ? ' ×' + c.count : '') + '</span><span>' + fmt(c.price) + '</span></div>'
  ).join('');

  return (
    '<div>' +
      '<div class="facts">' + facts.map((f) => '<span class="fact">' + esc(f) + '</span>').join('') + '</div>' +
      '<div class="lore">' + (it.lore && it.lore.length
        ? it.lore.map((l) => '<div>' + (mcToHtml(l) || '&nbsp;') + '</div>').join('')
        : '<div style="color:var(--dim)">该物品没有 lore 数据</div>') +
      '</div>' +
    '</div>' +
    '<div class="calc">' +
      (enchantChips || attrChips ? '<div class="facts">' + enchantChips + attrChips + '</div>' : '') +
      '<div class="calc-title">价格构成</div>' +
      calcRows +
      '<div class="calc-row" style="border:0;margin-top:8px">' +
        '<span style="color:var(--text)">合计' + (it.count > 1 ? '（单价 ' + fmt(it.unitPrice) + '）' : '') + '</span>' +
        '<span style="color:var(--gold)">' + fmt(it.price) + '</span>' +
      '</div>' +
      (it.wiki ? '<a class="wikilink" href="' + esc(it.wiki) + '" target="_blank" rel="noreferrer">在 Hypixel Wiki 查看 ↗</a>' : '') +
    '</div>'
  );
}

function renderItemRows() {
  const box = $('item-rows');
  if (!ITEMS.view.length) {
    box.innerHTML = '<div class="skeleton" style="padding:20px 0">没有匹配的物品</div>';
  } else {
    box.innerHTML = ITEMS.view.slice(0, ITEMS.shown).map((it, i) => itemBlock(it, i)).join('');
  }

  const more = ITEMS.shown < ITEMS.view.length;
  show($('load-more'), more);
  $('shown-count').textContent = ITEMS.view.length
    ? '显示 ' + ITEMS.shown + ' / ' + ITEMS.view.length + ' 件 · 合计 ' + fmt(ITEMS.view.reduce((a, b) => a + b.price, 0))
    : '';
}

async function loadItems(refresh) {
  const box = $('item-rows');
  box.innerHTML = '<div class="skeleton" style="padding:20px 0">加载物品明细…</div>';
  $('item-total').textContent = '';
  try {
    const url = '/api/items?player=' + encodeURIComponent(state.player) +
      '&profile=' + encodeURIComponent(state.profile) + (refresh ? '&refresh=1' : '');
    const d = await api(url);
    ITEMS.all = d.items || [];
    const sum = ITEMS.all.reduce((a, b) => a + b.price, 0);
    $('item-total').textContent = ITEMS.all.length + ' 件 · ' + fmt(sum);
    buildContainerOptions();
    applyItemFilters();
  } catch (e) {
    box.innerHTML = '<div class="skeleton" style="padding:20px 0">' + esc(e.message) + '</div>';
  }
}

$('item-rows').addEventListener('click', (e) => {
  const btn = e.target.closest('.irow');
  if (!btn) return;
  const block = btn.parentElement;
  const detail = block.querySelector('.idetail');
  if (block.classList.contains('open')) {
    block.classList.remove('open');
    detail.classList.add('hidden');
    return;
  }
  if (!detail.dataset.filled) {
    detail.innerHTML = detailHtml(ITEMS.view[Number(block.dataset.idx)]);
    detail.dataset.filled = '1';
  }
  detail.classList.remove('hidden');
  block.classList.add('open');
});

let searchTimer;
$('item-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyItemFilters, 150);
});
$('container-filter').addEventListener('change', applyItemFilters);
$('sort-by').addEventListener('change', applyItemFilters);
$('load-more').addEventListener('click', () => {
  ITEMS.shown = Math.min(ITEMS.shown + ITEMS.page, ITEMS.view.length);
  renderItemRows();
});

const initial = new URLSearchParams(location.search).get('player');
if (initial) { $('player').value = initial; lookup(initial); }
</script>
</body>
</html>
